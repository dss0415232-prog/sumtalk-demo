<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>숲톡 민원 접수</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand" href="./">숲톡</a></header><main class="wrap" style="max-width:740px;padding:32px 16px"><div class="panel"><h2>민원·상담 요청 접수</h2><p>접수 내용은 별도의 보안 서버로 전송됩니다. AI 관광 추천 서비스로 전송하지 않습니다.</p><div class="disc">실제 운영 전 기관의 개인정보 처리방침, 수집·이용 안내, 보유기간, 민원 처리 절차 및 개인정보 보호 담당자의 승인을 반영해야 합니다. 아래 안내는 배포 전 예시입니다.</div>
<form id="complaintForm" autocomplete="off"><div class="fld"><label class="t" for="category">접수 유형</label><select id="category"><option>일반</option><option>불편</option><option>칭찬</option><option>제안</option><option>단체상담</option></select></div>
<div class="fld"><label class="t" for="summary">민원 내용 (10~3,000자)</label><textarea id="summary" rows="6" minlength="10" maxlength="3000" required></textarea><div class="hint">주민등록번호, 금융정보 등 불필요한 민감정보를 입력하지 마세요.</div></div>
<div class="fld"><label class="t" for="name">이름</label><input id="name" maxlength="80" required></div>
<div class="fld"><label class="t" for="method">희망 연락방법</label><select id="method"><option>전화</option><option>문자</option><option>이메일</option></select></div>
<div class="fld"><label class="t" for="phone">전화번호</label><input id="phone" type="tel" autocomplete="off" maxlength="20"></div>
<div class="fld"><label class="t" for="email">이메일</label><input id="email" type="email" autocomplete="off" maxlength="150"></div>
<div class="fld"><label><input id="consent" type="checkbox" required> 개인정보 수집·이용에 동의합니다. (수집 항목: 이름, 선택한 연락처, 민원 내용 / 목적: 민원 처리 및 회신 / 보유기간: 기관 승인 정책 확정 후 명시)</label></div>
<div id="captcha"></div><button class="btn" type="submit" id="submit">민원 접수</button><p id="result" role="status" aria-live="polite"></p></form></div></main><script src="config.js"></script><script src="complaint.js"></script></body></html>
